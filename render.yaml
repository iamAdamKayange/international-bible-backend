services:
  - type: web
    name: true-international-bible-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: tib-notifications
          property: connectionString
      - key: REMOTE_CONFIG_JSON
        value: '{"flags":{"scriptureConnections":true},"announcements":[]}'
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
databases:
  - name: tib-notifications
    databaseName: tib_notifications
    user: tib_notifications
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
